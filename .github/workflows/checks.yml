name: Проверка исходников

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LocalAudiobookStudio.App/ClientApp/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Восстановить NuGet-пакеты
        run: dotnet restore LocalAudiobookStudio.sln --locked-mode
      - name: Проверить логику и API
        shell: pwsh
        run: |
          foreach ($project in @('Core', 'Application', 'Web')) {
            dotnet test --project "tests/LocalAudiobookStudio.$project.Tests/LocalAudiobookStudio.$project.Tests.csproj" -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Проверить и собрать интерфейс
        working-directory: src/LocalAudiobookStudio.App/ClientApp
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Проверить Python без моделей
        shell: pwsh
        run: |
          python -I -S -B -m unittest discover -s tests/VoxCpmInferenceWorker.Tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -S -B -m unittest discover -s tests/VoxCpmTrainingWorker.Tests -v
          exit $LASTEXITCODE
